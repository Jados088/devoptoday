
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CODERWANDA Ltd</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080d1b;color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px}
.wrapper{width:100%;max-width:1050px;min-height:620px;display:grid;grid-template-columns:1fr 1fr;background:#111a30;border:1px solid #273452;border-radius:25px;overflow:hidden;box-shadow:0 25px 80px #0008}
.welcome{padding:65px 45px;background:linear-gradient(145deg,#5237d7,#1767c9);display:flex;flex-direction:column;justify-content:center}
.logo{font-size:23px;font-weight:900;letter-spacing:1px}
.logo span{color:#b9e7ff}
.welcome h1{font-size:43px;line-height:1.15;margin:65px 0 20px}
.welcome p{color:#e1eaff;line-height:1.8}
.tag{margin-top:35px;font-size:13px;color:#d9e7ff}
.form-side{padding:65px 55px;display:flex;flex-direction:column;justify-content:center}
h2{font-size:30px;margin-bottom:10px}
.sub{color:#9eabc5;margin-bottom:35px}
label{display:block;font-size:13px;color:#c8d3e8;margin:20px 0 9px}
input{width:100%;padding:15px;background:#0a1224;border:1px solid #2a3857;border-radius:10px;color:white;outline:none}
input:focus{border-color:#9175ff;box-shadow:0 0 0 3px #9175ff22}
.password{position:relative}
.password button{position:absolute;right:12px;top:12px;background:none;border:0;color:#9eabc5;cursor:pointer}
.submit{width:100%;padding:16px;border:0;border-radius:10px;margin-top:28px;background:linear-gradient(90deg,#7654ed,#2587e8);color:white;font-weight:bold;font-size:15px;cursor:pointer}
.submit:hover{filter:brightness(1.15);transform:translateY(-2px)}
.message{font-size:13px;color:#ff9292;margin-top:15px;min-height:18px}
.bottom{text-align:center;color:#9eabc5;font-size:14px;margin-top:25px}
a{color:#9f8aff;text-decoration:none;font-weight:bold}
@media(max-width:750px){.wrapper{grid-template-columns:1fr}.welcome{padding:30px}.welcome h1{font-size:30px;margin:25px 0 12px}.form-side{padding:35px 25px}}
</style>
</head>
<body>
<div class="wrapper">
  <section class="welcome">
    <div class="logo">CODE<span>RWANDA</span> LTD.</div>
    <h1>Welcome<br>Back!</h1>
    <p>Your digital workspace is waiting for you. Sign in to manage your account, explore your dashboard and stay connected.</p>
    <div class="tag">✦ Smart technology. Better possibilities.</div>
  </section>
  <section class="form-side">
    <h2>Sign in</h2>
    <p class="sub">Enter your details to access your account.</p>
    <form id="loginForm">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <label>Password</label>
      <div class="password">
        <input type="password" id="password" placeholder="Enter your password" required>
        <button type="button" onclick="togglePassword()">Show</button>
      </div>
      <button class="submit" type="submit">Sign In →</button>
      <p class="message" id="message"></p>
    </form>
    <p class="bottom">Don't have an account? <a href="register.html">Create account</a></p>
  </section>
</div>
<script>
function togglePassword(){
 const p=document.getElementById('password');
 p.type=p.type==='password'?'text':'password';

}
document.getElementById('loginForm').addEventListener('submit',function(e){
 e.preventDefault();

 const email=document.getElementById('email').value.trim().toLowerCase();

 const password=document.getElementById('password').value;
 
 const users=JSON.parse(localStorage.getItem('cw_users')||'[]');
 const user=users.find(u=>u.email.toLowerCase()===email&&u.password===password);
 if(!user){
  document.getElementById('message').textContent='Incorrect email or password. Please try again.';
  return;
 }
 localStorage.setItem('cw_session',JSON.stringify({name:user.name,email:user.email}));
 window.location.href='index.html';

});

</script>
</body>
</html>
